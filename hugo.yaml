  # About
  about:
    enable: true
    title: "About me"
    image: "/images/linhtetwin_about_crop.jpg"
    content: |-
      I’m a Data Analyst with a Bachelor of Science in Computer Science and 1 year and 8 months of experience in data extraction, cleaning, and transformation. In my most recent role, I reviewed 100+ legal, financial, and operational documents every day, flagging personal information in line with GDPR and CCPA standards and turning raw data into clean, analysis-ready deliverables.

      My work centers on making data accurate and reliable so that teams can make decisions with confidence. I use Python, SQL, and advanced Excel for cleaning and analysis, and I’m continuing to build my skills in data visualization with Tableau and Power BI.

      I’m currently looking for a remote Data Analyst role. If you’d like to work together, feel free to get in touch.

    skills:
